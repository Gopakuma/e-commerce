spring:
  application:
    name: eureka-server
  environment: [ JAVA_TOOL_OPTIONS=-Xmx256m ]
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    org.springframework.cloud.netflix.eureka: TRACE
    com.netflix.discovery: TRACE
management:
  endpoints:
    web:
      exposure:
        include: health