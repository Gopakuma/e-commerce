services:
  eureka-server:
    build: ./eureka-server
    image: eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-db:
    image: postgres:15-alpine
    container_name: auth-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway-service:
    build: ./gateway
    image: gateway-service:latest
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ecommerce-network
    depends_on:
      eureka-server:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://eureka-server:8761/" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    image: auth-service:latest
    container_name: auth-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/ecom-authservice
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
    networks:
      - ecommerce-network

  user-service:
    build: ./user-service
    image: user-service:latest
    container_name: user-service
    ports:
      - "8082:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/ecom-userservice
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - ecommerce-network

  startup-message:
    image: alpine
    depends_on:
      gateway-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    command: >
      sh -c "
      echo '========================================';
      echo ' E-Commerce Microservices Started';
      echo '========================================';
      echo '';
      echo 'API Gateway : http://localhost:8080';
      echo 'Eureka      : http://localhost:8761';
      echo '';
      echo 'Services:';
      echo '✓ AUTH-SERVICE';
      echo '✓ USER-SERVICE';
      echo '✓ API-GATEWAY';
      echo '✓ EUREKA-SERVER';
      echo '';
      echo 'Ready for testing 🚀';
      echo '========================================';
      "

networks:
  ecommerce-network:
    driver: bridge

volumes:
  pgdata:
