server:
  port: 8080

spring:
  application:
    name: API-GATEWAY-SERVICE
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-swagger
              uri: lb://auth-service
              predicates:
                - Path=/auth/v3/api-docs
              filters:
                - RewritePath=/auth/v3/api-docs, /v3/api-docs

            - id: product-service-swagger
              uri: lb://product-service
              predicates:
                - Path=/product/v3/api-docs
              filters:
                - RewritePath=/product/v3/api-docs, /v3/api-docs

            - id: user-service-swagger
              uri: lb://user-service
              predicates:
                - Path=/user/v3/api-docs
              filters:
                - RewritePath=/user/v3/api-docs, /v3/api-docs

            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/user/**

            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/product/**

springdoc:
  version: '@springdoc.version@'
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: TRACE